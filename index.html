<img id="coin">
<button onclick="flip()"> Flip </button>
<script>
var heads = "https://digisoln.com/resources/coins/heads.png";
var tails = "https://digisoln.com/resources/coins/tails.png";
var coin = document.getElementById("coin");
function Random(max){
    return Math.floor((Math.random() * max) + 1)
}
function flip(){
    var number = Random(2);
    if (number == 1) { coin.src = heads } else { coin.src = tails }
}
</script>
